[package]
name = "dartsim"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Discrete-event simulator for tail-delay control in reconfigurable systems"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hmohammadalizadeh/DARTsim"
keywords = ["simulation", "queueing", "scheduling", "polling-systems"]
categories = ["science", "simulation"]

[lib]
name = "dartsim"
path = "src/lib.rs"

[[bin]]
name = "dartsim"
path = "src/main.rs"

[[bin]]
name = "dartsim-samples"
path = "src/bin/samples.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rand_xoshiro = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
